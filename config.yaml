watchlist:
  - MU

# cboe preferred when fresh; auto-falls back to yahoo if Cboe CDN is stale
data_provider: cboe

# Live auto-scan only during US equity options RTH (09:30–16:00 ET) unless true
scan_when_closed: false

max_expiries: 4

poll_interval_seconds: 90
live_poll_interval_seconds: 90

heuristics:
  min_premium_usd: 75000
  min_vol_oi_ratio: 1.0
  min_volume: 500
  min_delta_volume: 20
  min_dte: 1
  max_dte: 45
  max_moneyness: 0.20
  # AI: calibrated score + day percentile + strike cluster + outcome memory
  institutional:
    min_score: 0.50
    min_premium_usd: 20000
    min_percentile: 0.82
    cluster_percentile: 0.68
  # Outcome memory: exponential decay half-life in days (old regimes fade)
  memory:
    half_life_days: 30

database: data/flow.db
