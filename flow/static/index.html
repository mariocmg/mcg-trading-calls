<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FLOW — MU</title>
<style>
  * { box-sizing: border-box; }
  body { background: #0a0e14; color: #e6edf3; font-family: system-ui, sans-serif;
         margin: 0 auto; max-width: 900px; padding: 24px 16px 64px; }
  header { display: flex; justify-content: space-between; align-items: baseline; }
  h1 { font-size: 20px; margin: 0; letter-spacing: 2px; }
  #meta { color: #8b949e; font-size: 13px; }
  h2 { font-size: 13px; letter-spacing: 2px; color: #8b949e; margin: 32px 0 12px; }
  #direction { font-size: 44px; font-weight: 800; margin: 8px 0 4px; }
  #direction.ALCISTA { color: #3fb950; }
  #direction.BAJISTA { color: #f85149; }
  #direction.NEUTRAL { color: #d29922; }
  #headline { font-size: 20px; margin: 0 0 6px; }
  #evidence { color: #c9d1d9; margin: 0; }
  #net { color: #8b949e; font-size: 14px; margin-top: 8px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: left; color: #8b949e; font-weight: 600; border-bottom: 1px solid #30363d; padding: 6px 8px 6px 0; }
  td { border-bottom: 1px solid #21262d; padding: 7px 8px 7px 0; }
  .buy { color: #3fb950; } .sell { color: #f85149; } .unknown { color: #8b949e; }
  .levels { font-size: 18px; line-height: 1.9; }
  .levels b { font-size: 22px; }
  .levels .lbl { color: #8b949e; font-size: 14px; }
  button { background: #21262d; color: #e6edf3; border: 1px solid #30363d;
           border-radius: 6px; padding: 8px 14px; cursor: pointer; font-size: 14px; }
  button:hover { background: #30363d; }
  #error { color: #f85149; }
  .empty { color: #8b949e; }
</style>
</head>
<body>
<header>
  <h1>FLOW · MU</h1>
  <span id="meta"></span>
</header>

<h2>VEREDICTO</h2>
<div id="direction">—</div>
<p id="headline"></p>
<p id="evidence"></p>
<p id="net"></p>
<p id="error"></p>

<h2>PRINTS INUSUALES DEL DÍA</h2>
<table>
  <thead><tr><th>Strike</th><th>Vto.</th><th>C/P</th><th>Prima</th><th>Vol / OI</th><th>Sesgo</th></tr></thead>
  <tbody id="prints"></tbody>
</table>

<h2>NIVELES — VENCIMIENTO SEMANAL</h2>
<div class="levels" id="levels"></div>

<p style="margin-top:32px"><button id="scanBtn">Escanear ahora</button></p>

<script>
const $ = id => document.getElementById(id);
const money = n => '$' + n.toLocaleString('en-US');
const sideLabel = s => ({ buy: 'COMPRA', sell: 'VENTA', unknown: '?' }[s] || s);
const sideClass = s => ({ buy: 'buy', sell: 'sell', unknown: 'unknown' }[s] || '');

async function load() {
  try {
    const s = await (await fetch('/api/state')).json();
    if (s.error && !s.verdict) { $('error').textContent = s.error; return; }
    $('meta').textContent = (s.spot ? 'MU $' + s.spot : '') +
      ' · ' + (s.source || '') + ' · ' +
      (s.market_open ? 'mercado abierto' : 'mercado cerrado') +
      (s.updated_at ? ' · ' + new Date(s.updated_at).toLocaleTimeString() : '');
    const v = s.verdict;
    $('direction').textContent = v.direction;
    $('direction').className = v.direction;
    $('headline').textContent = v.headline;
    $('evidence').textContent = v.evidence;
    $('net').textContent = 'Neto con sesgo: ' + money(v.net) + ' $';
    $('error').textContent = s.error || '';
    $('prints').innerHTML = (s.prints || []).map(p =>
      `<tr><td>${p.strike}</td><td>${p.expiry}</td><td>${p.call_put}</td>` +
      `<td>${money(p.premium)}</td><td>${p.volume} / ${p.open_interest}</td>` +
      `<td class="${sideClass(p.side)}">${sideLabel(p.side)}</td></tr>`).join('') ||
      '<tr><td colspan="6" class="empty">Sin prints inusuales todavía.</td></tr>';
    const lv = s.levels;
    $('levels').innerHTML = lv
      ? `<div><span class="lbl">Vencimiento</span> ${lv.expiry}</div>` +
        `<div><span class="lbl">Muro call (resistencia)</span> <b>${lv.call_wall.strike}</b> <span class="lbl">OI ${lv.call_wall.oi.toLocaleString()}</span></div>` +
        `<div><span class="lbl">Muro put (soporte)</span> <b>${lv.put_wall.strike}</b> <span class="lbl">OI ${lv.put_wall.oi.toLocaleString()}</span></div>` +
        `<div><span class="lbl">Max pain</span> <b>${lv.max_pain.strike}</b></div>`
      : '<span class="empty">Sin niveles todavía.</span>';
  } catch (e) { $('error').textContent = 'No se pudo cargar el estado: ' + e; }
}
$('scanBtn').onclick = async () => {
  $('scanBtn').disabled = true; $('scanBtn').textContent = 'Escaneando…';
  try { await fetch('/api/scan', { method: 'POST' }); await load(); }
  finally { $('scanBtn').disabled = false; $('scanBtn').textContent = 'Escanear ahora'; }
};
load();
setInterval(load, 60000);
</script>
</body>
</html>
